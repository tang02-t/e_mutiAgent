project:
  name: transformer-diagnosis-agent
  environment: dev

# ============================================================
# 多 LLM 配置：每个智能体可独立配置不同的模型
# 若某智能体未配置，则使用 default 的配置
# ============================================================
llms:
  # 默认配置（各智能体未单独配置时使用；Retriever 不调用 LLM）
  default:
    provider: "openai"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key: "YOUR_API_KEY"
    model_name: "qwen3.7-flash"
    temperature: 0.2
    max_tokens: 2048
    enable_thinking: false
    # 单次请求超时时间（秒）；网络抖动时及时失败并触发降级
    timeout: 60
    # 失败后的最大重试次数（指数退避）
    max_retries: 2

  # Planner：策略规划，需要较强的推理能力
  planner:
    provider: "openai"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key: "YOUR_API_KEY"
    model_name: "qwen3.7-flash"
    temperature: 0.2
    max_tokens: 2048
    enable_thinking: false

  # 微调后的 Planner（P5 产物）。仅当 workflow.planner_mode = finetuned 时启用；
  # 缺省字段继承 planner。百炼 LoRA 导入模型只支持 DashScope 原生接口，provider 需按 llm.py 适配层填写。
  # planner_finetuned:
  #   # 百炼「模型调优」或「自定义模型导入」（LoRA）产出的模型只能以 DashScope 原生方式调用，不支持 OpenAI 兼容模式
  #   provider: "dashscope"                       # 需 pip install dashscope
  #   base_url: ""                                 # 留空用默认；专属网关时填 https://<gateway>/api/v1
  #   api_key: "YOUR_API_KEY"
  #   model_name: "qwen3-vl-8b-planner-lora-m3"   # 百炼「我的模型」中的部署名（模型 ID）
  #   temperature: 0.0
  #   enable_thinking: false

  # Generator：生成诊断建议，可使用较轻量的模型
  generator:
    provider: "openai"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key: "YOUR_API_KEY"
    model_name: "qwen3.7-flash"
    temperature: 0.1
    max_tokens: 2048
    enable_thinking: false

  # Validator：质量验证，可使用较轻量的模型
  validator:
    provider: "openai"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key: "YOUR_API_KEY"
    model_name: "qwen3.7-flash"
    temperature: 0.1
    max_tokens: 1024
    enable_thinking: false

logging:
  level: "INFO"

workflow:
  max_iterations: 3  # Generator 重生成的最大迭代次数（Validator 触发）
  parallel_tools: 3   # Retriever 并行工具调用的最大并发数
  # Planner 实验模式（P5-5 / P6 对比开关）：
  #   baseline  —— 使用 llms.planner（通用大模型）
  #   finetuned —— 使用 llms.planner_finetuned（LoRA 微调后的 Planner）；缺失时自动回退 baseline
  # 可被 scripts/eval_end2end.py --planner-mode 与前端侧边栏覆盖
  planner_mode: baseline
  # B-4 主动规划开关：
  #   planner_strategy: free   —— v1 行为，Planner 只做意图分析 + 工具决策
  #                     active —— Planner 输出 action: ask | call_tool | conclude，按 EIG 推荐决定是否追问
  #   planner_decision: llm    —— active 下由大模型决策（LLM 不可用时自动回退 eig）
  #                     eig    —— 不调 LLM，直接按最高 VoI 征兆决策（B-5 的 eig_greedy）
  #   max_inquiry_rounds: 追问轮数上限 K
  #   attribution_mode: expert     —— 归因引擎用专家默认 CPT
  #                     calibrated —— 加载 data/real/dga/learned_params.json（B-1 校准参数）
  planner_strategy: free
  planner_decision: llm
  max_inquiry_rounds: 3
  attribution_mode: calibrated
  # C-1 Generator 输出模式：
  #   text   —— v1 行为，只输出自然语言草案
  #   claims —— 先输出 JSON 声明列表（state.draft_claims，见 docs/claim_schema.md）再输出自然语言草案；
  #             LLM 不可用或 JSON 非法时按工具结果规则拼装声明，链路不断
  generator_output_mode: text
  # C-2 声明级约束核查（依赖 generator_output_mode=claims 或模板回退产出的规则声明）：
  #   claim_check: off   —— v1 整体评分 Validator
  #                check —— 逐条核对声明与证据（DATA / EVIDENCE / APPLICABILITY / SAFETY），按规则判定 PASS / REVISION / ABSTAIN
  #                route —— check + 补证 / 重规划路由（C-3，写入 state.missing_evidence）
  #   claim_semantic_layer: 是否对 inference 声明做 LLM NLI 判定（LLM 不可用时自动跳过）
  #   claim_rel_tol / claim_abs_tol: 数值一致性容差；claim_unsupported_threshold: 无依据占比阈值；
  #   claim_abstain_after: 第 N 次评估仍不通过则 ABSTAIN（默认 3 = 两轮修订后）
  claim_check: off
  claim_semantic_layer: true
  claim_rel_tol: 0.02
  claim_abs_tol: 0.05
  claim_unsupported_threshold: 0.3
  claim_abstain_after: 3
